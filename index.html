<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiến Lên - Three.js</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #1a472a;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    button:hover {
      background: #005a9e;
    }

    button:active {
      transform: scale(0.95);
    }

    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px 40px;
      border-radius: 8px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .message.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud">
    <div id="player-info">Waiting for game to start...</div>
    <div id="table-info" style="margin-top: 10px;"></div>
  </div>
  <div class="controls">
    <button class="play-btn">Play Cards</button>
    <button class="pass-btn">Pass</button>
  </div>
  <div class="message" id="message"></div>

  <script type="module" src="/src/index.js"></script>
</body>
</html>
